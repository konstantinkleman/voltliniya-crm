name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      UPLOAD_DIR: ./uploads
      ADMIN_EMAIL: d@test.ru
      ADMIN_PASSWORD: secret123
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: smoke
        run: DATABASE_URL=sqlite:///./test.db python tests/smoke.py
      - name: intake
        run: DATABASE_URL=sqlite:///./test_intake.db INTAKE_TOKEN=tok-123 python tests/intake.py
      - name: adspend
        run: >
          DATABASE_URL=sqlite:///./test_adspend.db INTAKE_TOKEN=tok-123
          YANDEX_DIRECT_TOKEN=y-tok AVITO_CLIENT_ID=a-id AVITO_CLIENT_SECRET=a-sec python tests/adspend.py
