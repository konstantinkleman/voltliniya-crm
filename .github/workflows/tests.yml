name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      UPLOAD_DIR: ./uploads
      ADMIN_EMAIL: d@test.ru
      ADMIN_PASSWORD: secret123
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: smoke
        run: DATABASE_URL=sqlite:///./test.db python tests/smoke.py
      - name: avito timing and guard
        run: python tests/avito_timing.py
      - name: avito end-to-end
        run: >
          DATABASE_URL=sqlite:///./test_avito.db AVITO_CLIENT_ID=x AVITO_CLIENT_SECRET=y AVITO_WEBHOOK_SECRET=hook
          ANTHROPIC_API_KEY=fake AVITO_WORKER_ENABLED=0 python tests/avito.py
